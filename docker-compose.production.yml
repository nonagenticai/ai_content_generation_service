services:
  # ============================================================================
  # PostgreSQL Database (Production)
  # ============================================================================
  ai_content_generation_service_postgres:
    image: postgres:18-alpine
    container_name: ai_content_generation_service_postgres_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_content_generation_service
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5460:5432"
    volumes:
      - ai_content_generation_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contentgen-network
    restart: always

  # ============================================================================
  # Redis Cache (Production)
  # ============================================================================
  ai-content-generation-service-redis:
    image: redis:7-alpine
    container_name: ai_content_generation_service_redis_prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6400:6379"
    volumes:
      - ai_content_generation_service_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contentgen-network
    restart: always

  # ============================================================================
  # AI Content Generation Service API (Production)
  # ============================================================================
  ai-content-generation-service-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ai_content_generation_service_api_prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@ai_content_generation_service_postgres:5432/ai_content_generation_service
      REDIS_URL: redis://ai-content-generation-service-redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 6310
      API_DEBUG: "false"
      AUTH_ENABLED: "true"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/data/content-generation
      LOG_LEVEL: WARNING
      LOG_JSON_LOGS: "true"
    ports:
      - "6310:6310"
    volumes:
      - ai_content_generation_service_data:/app/data/content-generation
    depends_on:
      ai_content_generation_service_postgres:
        condition: service_healthy
      ai-content-generation-service-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6310/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - contentgen-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  contentgen-network:
    driver: bridge

volumes:
  ai_content_generation_service_postgres_data:
    name: ai_content_generation_service_postgres_data_prod
  ai_content_generation_service_redis_data:
    name: ai_content_generation_service_redis_data_prod
  ai_content_generation_service_data:
    name: ai_content_generation_service_data_prod
